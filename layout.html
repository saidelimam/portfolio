    <!-- Keep the copyright year current for JS-enabled visitors (both the meta
         tag and the visible footer). The static markup ships the build year as
         the no-JS fallback. -->
    <script>
      (function () {
        var year = String(new Date().getFullYear());
        var meta = document.querySelector('meta[name="copyright"]');
        if (meta) {
          meta.setAttribute('content', meta.getAttribute('content').replace(/\d{4}/, year));
        }
        document.querySelectorAll('[data-current-year]').forEach(function (el) {
          el.textContent = year;
        });
      })();
    </script>
