<!doctype html>
<html lang="en">
  <head>
    <title>Discography - {{TITLE}}</title>

    <meta name="keywords" content="discography, music, Said Elimam, albums, music production, compositions" />
  </head>
  <body>
    <header role="banner">
      <nav class="container" role="navigation" aria-label="Main navigation">
        <ul class="nav-links" role="list">
          <li role="listitem"><a href="/" aria-label="Go to Home">Home</a></li>
          <li role="listitem"><a href="/photography" aria-label="Go to Photography gallery">Photography</a></li>
          <li role="listitem"><a href="/videography" aria-label="Go to Videography gallery">Videography</a></li>
          <li role="listitem"><a href="/discography" aria-label="Go to Discography gallery">Discography</a></li>
        </ul>
      </nav>
    </header>

    <main role="main">
      <section id="discography-gallery" class="gallery-section" aria-labelledby="discography-heading">
        <div class="gallery-container">
          <div class="gallery-head" data-reveal>
            <span class="gallery-emblem gallery-emblem--disco" aria-hidden="true">
              <svg class="emblem-svg emblem-eq" viewBox="0 0 24 24" role="presentation" focusable="false">
                <rect class="eq-bar eq-bar-1" x="2.7" y="4" width="2.6" height="16" rx="1.3" />
                <rect class="eq-bar eq-bar-2" x="6.7" y="4" width="2.6" height="16" rx="1.3" />
                <rect class="eq-bar eq-bar-3" x="10.7" y="4" width="2.6" height="16" rx="1.3" />
                <rect class="eq-bar eq-bar-4" x="14.7" y="4" width="2.6" height="16" rx="1.3" />
                <rect class="eq-bar eq-bar-5" x="18.7" y="4" width="2.6" height="16" rx="1.3" />
              </svg>
            </span>
            <span class="gallery-kicker">Sound</span>
            <h1 id="discography-heading" class="gallery-title">Discography</h1>
          </div>

          <div class="discography-grid" role="list" aria-label="Discography" data-reveal-group>
            {{ALBUMS}}
          </div>
        </div>
      </section>
    </main>

    <!-- JavaScript - Load as modules for modern browsers (automatically deferred) -->
    <script type="module" src="../src/js/discography.js"></script>
  </body>
</html>
