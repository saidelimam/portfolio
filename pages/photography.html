<!doctype html>
<html lang="en">
  <head>
    <title>Photography Gallery - {{TITLE}}</title>

    <meta
      name="keywords"
      content="photography, portfolio, Said Elimam, gallery, professional photography, visual arts"
    />
  </head>
  <body>
    <header role="banner">
      <nav class="container" role="navigation" aria-label="Main navigation">
        <ul class="nav-links" role="list">
          <li role="listitem"><a href="/" aria-label="Go to Home">Home</a></li>
          <li role="listitem"><a href="/photography" aria-label="Go to Photography gallery">Photography</a></li>
          <li role="listitem"><a href="/videography" aria-label="Go to Videography gallery">Videography</a></li>
          <li role="listitem"><a href="/discography" aria-label="Go to Discography gallery">Discography</a></li>
        </ul>
      </nav>
    </header>

    <main role="main">
      <section id="photography-gallery" class="gallery-section" aria-labelledby="photography-heading">
        <div class="gallery-container">
          <div class="gallery-head" data-reveal>
            <span class="gallery-emblem gallery-emblem--photo" aria-hidden="true">
              <svg class="emblem-svg emblem-aperture" viewBox="0 0 24 24" role="presentation" focusable="false">
                <circle class="e-rim" cx="12" cy="12" r="11" />
                <g class="ap-spin">
                  <g class="ap-breathe">
                    <path d="M14.31 8l5.74 9.94" />
                    <path d="M9.69 8h11.48" />
                    <path d="M7.38 12l5.74-9.94" />
                    <path d="M9.69 16L3.95 6.06" />
                    <path d="M14.31 16H2.83" />
                    <path d="M16.62 12l-5.74 9.94" />
                  </g>
                </g>
              </svg>
            </span>
            <span class="gallery-kicker">Stills</span>
            <h1 id="photography-heading" class="gallery-title">Photography</h1>
          </div>

          <div class="photo-mosaic" role="list" aria-label="Photography gallery" data-reveal-group>{{PHOTOS}}</div>
        </div>
      </section>
    </main>

    <!-- Image Lightbox Modal -->
    <div id="image-modal" class="image-modal" role="dialog" aria-modal="true" aria-label="Image viewer">
      <div class="image-modal-backdrop"></div>
      <button type="button" class="image-modal-close" aria-label="Close image viewer">
        <svg class="icon" aria-hidden="true"><use href="#i-xmark" /></svg>
      </button>
      <button type="button" class="image-modal-nav image-modal-prev" aria-label="Previous image">
        <svg class="icon" aria-hidden="true"><use href="#i-chevron-left" /></svg>
      </button>
      <button type="button" class="image-modal-nav image-modal-next" aria-label="Next image">
        <svg class="icon" aria-hidden="true"><use href="#i-chevron-right" /></svg>
      </button>
      <div class="image-modal-content">
        <div class="image-modal-loading">
          <div class="loading-spinner"></div>
        </div>
        <img src="" alt="" class="image-modal-img" draggable="false" />
      </div>
    </div>

    <script type="module" src="../src/js/photography.js"></script>
  </body>
</html>
