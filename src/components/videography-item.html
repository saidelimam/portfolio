<div class="video-item" role="listitem" data-video-id="{{VIDEO_ID}}" data-reveal>
  <div class="video-cover" role="button" tabindex="0" aria-label="Play video: {{TITLE}}">
    <img src="{{COVER_SRC}}" alt="Cover image for {{TITLE}}" loading="lazy" draggable="false" />
    <div class="play-button" aria-hidden="true">
      <svg class="icon" aria-hidden="true"><use href="#i-play" /></svg>
    </div>
  </div>
</div>
